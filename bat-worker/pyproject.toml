[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "batworker"
version = "0.1.0a1"
description = "Unattended worker robot daemon and edge runner for BAT Automate"
requires-python = ">=3.10"
dependencies = [
    "batautomate>=0.1.0b1",
    "psutil>=5.9.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
batworker = "batworker.cli:main"

[tool.setuptools.packages.find]
include = ["batworker*"]
