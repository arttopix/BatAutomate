[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "batstudio"
version = "0.1.0a1"
description = "Developer Studio, Step Inspector, and Live Debugger for BAT Automate"
requires-python = ">=3.10"
dependencies = [
    "batautomate>=0.1.0b1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
batstudio = "batstudio.cli:main"

[tool.setuptools.packages.find]
include = ["batstudio*"]
